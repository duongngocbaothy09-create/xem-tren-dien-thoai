<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSFiddle 0gf5qych</title>

  <style>
    html, body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  font-family: 'Segoe UI', sans-serif;
}

.container {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: #fff;
  text-align: center;
  max-width: 85%;
  font-size: 20px;
  line-height: 1.7;
  text-shadow: 0 2px 5px rgba(0,0,0,0.3);
  z-index: 2;
}

.cursor {
  display: inline-block;
  width: 2px;
  background: white;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,50% { opacity: 1; }
  51%,100% { opacity: 0; }
}

.floating {
  position: absolute;
  animation: float 10s linear infinite;
  opacity: 0.85;
}

@keyframes float {
  0% {
    transform: translateY(110vh) scale(0.6) rotate(0deg);
    opacity: 0;
  }
  10% { opacity: 1; }
  100% {
    transform: translateY(-10vh) scale(1.2) rotate(360deg);
    opacity: 0;
  }
}

.music-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: rgba(255,105,180,0.9);
  color: white;
  border: none;
  padding: 12px 16px;
  border-radius: 50px;
  font-size: 16px;
  cursor: pointer;
  z-index: 5;
  box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}
  </style>

  
</head>
<body>
  <div class="container">
  <span id="text"></span><span class="cursor"></span>
</div>

<button class="music-btn" onclick="playMusic()">🎶 Bật nhạc</button>

<audio id="bgm" loop>
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_7e6b4bb9df.mp3" type="audio/mpeg">
</audio>

  <script>
    function playMusic() {
  document.getElementById("bgm").play();
}

const message = `Dear người em yêu,
Chúc anh một ngày vui vẻ và ý nghĩa.
Em không biết yêu một người nhiều là như thế nào.
Nhưng ngày hôm nay em sẽ yêu anh nhiều hơn ngày hôm qua và ít hơn ngày mai.
Cảm ơn anh thời gian qua đã luôn bên cạnh và yêu thương em.
Mong rằng chúng ta sẽ mãi bên nhau và yêu thương nhau nhiều hơn nhé!!
Love you so much 💗`;

let index = 0;
const speed = 45;
const textEl = document.getElementById("text");

function typeWriter() {
  if (index < message.length) {
    textEl.innerHTML += message.charAt(index) === "\n"
      ? "<br>"
      : message.charAt(index);
    index++;
    setTimeout(typeWriter, speed);
  }
}
typeWriter();

// Chỉ TIM + HOA
const icons = ["💗", "🌸", "🌹"];

function createItem() {
  const item = document.createElement("div");
  item.className = "floating";
  item.innerHTML = icons[Math.floor(Math.random() * icons.length)];
  item.style.left = Math.random() * 100 + "vw";
  item.style.fontSize = (18 + Math.random() * 30) + "px";
  item.style.animationDuration = (6 + Math.random() * 6) + "s";
  document.body.appendChild(item);

  setTimeout(() => item.remove(), 12000);
}

setInterval(createItem, 250);
  </script>
</body>
</html>
